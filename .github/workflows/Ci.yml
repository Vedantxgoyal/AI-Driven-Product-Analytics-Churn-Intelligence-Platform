name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  BASELINE_F1: "0.70"

jobs:

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint deps
        run: pip install ruff black
      - name: Ruff
        run: ruff check src/ app/ --ignore E501,F401,E402,W291,W293 || true
      - name: Black
        run: black --check src/ app/ --line-length 120 || true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pandas numpy scikit-learn \
                      xgboost shap mlflow imbalanced-learn duckdb \
                      python-dotenv pydantic evidently pytest httpx \
                      pytest-asyncio anyio
      - name: Run tests
        run: pytest tests/ --import-mode=importlib -q

  model-eval:
    name: Model Eval Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost shap \
                      mlflow imbalanced-learn
      - name: Train & evaluate
        run: |
          python - <<'PYEOF'
          import sys
          from src.ml.train import load_data, build_features, train
          df = load_data()
          X, y = build_features(df)
          _, metrics = train(X, y)
          f1 = metrics["f1"]
          baseline = float("${{ env.BASELINE_F1 }}")
          print(f"F1={f1:.4f} baseline={baseline}")
          if f1 < baseline:
              print(f"GATE FAILED")
              sys.exit(1)
          print("GATE PASSED")
          PYEOF

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: model-eval
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: churn-intelligence:latest