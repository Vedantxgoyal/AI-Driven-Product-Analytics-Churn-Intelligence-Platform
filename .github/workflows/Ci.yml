name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  BASELINE_F1: "0.70"

jobs:

  # ── 1. Lint + Type Check ─────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint deps
        run: pip install ruff black mypy

      - name: Ruff
      run: ruff check src/ app/ --ignore E501,F401,E402,W291
      continue-on-error: true
      - name: Black
      run: black --check src/ app/ --line-length 120
      continue-on-error: true

  # ── 2. Tests + Coverage ──────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Data validation gate
        run: python src/data/validate.py

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=src --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  # ── 3. Model Eval Gate ───────────────────────────────────────────────────
  model-eval:
    name: Model Eval Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Train & evaluate model
        run: |
          python - <<'PYEOF'
          import sys
          from src.ml.train import load_data, build_features, train

          df           = load_data()
          X, y         = build_features(df)
          _, metrics   = train(X, y)
          f1           = metrics["f1"]
          pr_auc       = metrics["pr_auc"]
          baseline     = float("${{ env.BASELINE_F1 }}")

          print(f"F1={f1:.4f} | PR-AUC={pr_auc:.4f} | Baseline={baseline}")

          if f1 < baseline:
              print(f"GATE FAILED: F1 {f1:.4f} < baseline {baseline}")
              sys.exit(1)

          print(f"GATE PASSED: F1 {f1:.4f} >= baseline {baseline}")
          PYEOF

  # ── 4. Docker Build ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: model-eval
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: churn-intelligence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max